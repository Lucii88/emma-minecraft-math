name: Dračí ostrovy – testy

on:
  pull_request:
    paths:
      - 'draci-ostrovy/**'
      - '.github/workflows/draci-ostrovy-ci.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: draci-ostrovy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: draci-ostrovy/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
